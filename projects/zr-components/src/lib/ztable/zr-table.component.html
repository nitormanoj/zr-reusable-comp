<div class="zr-table-container">

  <div class="zr-table-toolbar">
    <input
      #searchInput
      type="search"
      class="search-input"
      [value]="searchText"
      placeholder="Search across table..."
      aria-label="Search table"
      (input)="onSearch(searchInput.value)"
    />
  </div>

  <p-table
    #dt
    [value]="data"
    [columns]="columns"
    [dataKey]="dataKey"
    [paginator]="paginator"
    [rows]="rows"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [globalFilterFields]="globalFilterFields"
    [showCurrentPageReport]="paginator"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords}"
    [scrollable]="true"
    [tableStyle]="{ 'min-width': '700px' }"
  >

    <ng-template #header>
      <tr>

        <th class="checkbox-column">
          <input
            #selectAll
            type="checkbox"
            [checked]="allSelected"
            [indeterminate]="partiallySelected"
            [disabled]="filteredRows.length === 0"
            (change)="toggleAll(selectAll.checked)"
            aria-label="Select all matching rows"
          />
        </th>

        <th
          *ngFor="let column of columns"
          class="zr-column-header"
          [style.width]="column.width"
        >
          {{ column.header }}
        </th>

      </tr>
    </ng-template>

    <ng-template #body let-row>
      <tr>

        <td class="checkbox-column">
          <input
            #rowCheckbox
            type="checkbox"
            [checked]="isSelected(row)"
            (change)="toggleRow(row, rowCheckbox.checked)"
            [attr.aria-label]="'Select row ' + row[dataKey]"
          />
        </td>

        <td
          *ngFor="let column of columns"
          [style.width]="column.width"
        >
          {{ row[column.field] }}
        </td>

      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td
          class="empty-message"
          [attr.colspan]="columns.length + 1"
        >
          No records found.
        </td>
      </tr>
    </ng-template>

  </p-table>

</div>
