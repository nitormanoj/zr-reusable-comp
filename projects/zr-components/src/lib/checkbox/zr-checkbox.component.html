<div
  class="zr-checkbox"
  [class.zr-checkbox--disabled]="disabled"
>
  <span class="zr-checkbox-container">
    <p-checkbox
      styleClass="zr-checkbox-control"
      [binary]="true"
      [inputId]="inputId"
      [ngModel]="checked"
      [disabled]="disabled"
      (ngModelChange)="onCheckedChange($event)">
    </p-checkbox>
  </span>

  <label
    *ngIf="label"
    class="zr-checkbox-label"
    [for]="inputId">
    {{ label }}
  </label>
</div>
