<div class="example-panel">
  <div class="tabs">
    <button (click)="preview = true" [class.active]="preview">Preview</button>
    <button (click)="preview = false" [class.active]="!preview">Code</button>
  </div>

  <div class="panel-body">
    @if (preview) {
      <div class="preview"><ng-content></ng-content></div>
    }
    @if (!preview) {
      <div class="code"><sc-code-block [code]="code" [language]="language"></sc-code-block></div>
    }
  </div>
</div>
