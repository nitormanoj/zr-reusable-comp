<div class="example-panel">
  <div class="tabs">
    <button (click)="preview = true" [class.active]="preview">Preview</button>
    <button (click)="preview = false" [class.active]="!preview">Code</button>
  </div>

  <div class="panel-body">
    <div *ngIf="preview" class="preview"><ng-content></ng-content></div>
    <div *ngIf="!preview" class="code"><sc-code-block [code]="code" [language]="language"></sc-code-block></div>
  </div>
</div>
