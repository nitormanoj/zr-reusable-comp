<div class="table-page">

  <div class="page-header">
    <div>
      <h1>Table</h1>
      <p>
        Reusable table with global search,
        checkbox selection and pagination.
      </p>
    </div>
  </div>

  <sc-example-panel
    title="Basic Table"
    [code]="tableCode"
  >

    <div class="table-preview">
      <zr-table
        [data]="projects"
        [columns]="columns"
        dataKey="id"
        [paginator]="true"
        [rows]="5"
        [rowsPerPageOptions]="[5, 10, 20]"
        [(selectedRows)]="selectedProjects">
      </zr-table>
    </div>

  </sc-example-panel>

</div>
